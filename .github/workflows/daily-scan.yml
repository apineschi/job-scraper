name: Daily Museum Job Scan

on:
  workflow_dispatch: # Manual trigger

jobs:
  debug_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Run Scraper
        run: python jobscraper.py > results.txt

      - name: Force Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "DEBUG: Museum Job Test"
          to: ${{ secrets.EMAIL_TO }}
          from: "Job Bot"
          body: |
            If you are reading this, the connection worked!
            
            Scraper Results:
            $(cat results.txt)
