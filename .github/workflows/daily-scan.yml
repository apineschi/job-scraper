name: Daily Job Scan

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        id: scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py > results.txt
          cat results.txt

          if grep -q "FOUND" results.txt; then
            echo "MATCH_FOUND=true" >> $GITHUB_ENV
          fi

      - name: Send email notification
        if: env.MATCH_FOUND == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Job Alert: New Match Found!"
          to: ${{ secrets.EMAIL_TO }}
          from: "Job Scraper Bot"
          html_body: file://email_digest.html

      - name: Save scan results
        if: always()
        run: |
          git config --global user.name 'Job-Bot'
          git config --global user.email 'bot@github.com'
          git add data/seen_jobs.json docs/status.json docs/jobs.json
          git commit -m "Update scan results" || echo "No changes to commit"
          git push
