name: Test Email Output

on:
  workflow_dispatch:

jobs:
  test_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Run Scraper
        run: |
          # We run the script and capture EVERYTHING it prints
          python jobscraper.py > test_results.txt
          
          # Load the results into the environment
          echo "TEST_BODY<<EOF" >> $GITHUB_ENV
          cat test_results.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Test Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Job Scraper Test Results"
          to: ${{ secrets.EMAIL_TO }}
          from: "Museum Job Bot"
          body: |
            Here are the results from the scraper:

            ${{ env.TEST_BODY }}
