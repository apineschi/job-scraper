<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scraper Status</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9198a5;
    --ok: #3ecf6e;
    --err: #f2545b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.75rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    color: #111;
  }
  .card.ok { border-left-color: var(--ok); }
  .card.error { border-left-color: var(--err); }
  .card-title { font-weight: 600; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem; }
  .card-title a { color: #111; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); }
  .dot.error { background: var(--err); }
  .meta { color: #333; font-size: 0.82rem; line-height: 1.5; }
  .error-text { color: #a4232b; font-size: 0.82rem; margin-top: 0.4rem; word-break: break-word; }
  .job {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.6rem;
    color: #111;
  }
  .job .meta { margin-top: 0.3rem; }
  .job a { color: #111; text-decoration: none; font-weight: 600; }
  .job a:hover { text-decoration: underline; }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
  .closing-soon {
    background: rgba(255, 90, 90, 0.22);
    color: #ff9c9c;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .archive-btn {
    background: rgba(0,0,0,0.08);
    color: #111;
    border: none;
    border-radius: 4px;
    padding: 0.2rem 0.55rem;
    font-size: 0.72rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .archive-btn:hover { background: rgba(0,0,0,0.16); }
  .jobs-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem; margin: 2rem 0 0.75rem; }
  .jobs-header h2 { margin: 0; }
  .filter-wrap { position: relative; }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .filter-btn:hover { border-color: var(--muted); }
  .filter-panel {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 0.4rem);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem;
    min-width: 240px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .filter-panel.open { display: block; }
  .filter-panel-actions { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  .filter-panel-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .filter-panel-actions button:hover { color: var(--text); }
  .filter-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.2rem; font-size: 0.85rem; cursor: pointer; }
  .filter-option:hover { color: var(--muted); }
  .filter-option input { flex-shrink: 0; }
</style>
</head>
<body>
  <h1>Job Scraper Status</h1>
  <div class="subtitle" id="last-updated">Loading…</div>

  <h2>Source health</h2>
  <div class="grid" id="status-grid"><div class="empty">Loading status…</div></div>

  <div class="jobs-header">
    <h2>Recent matches</h2>
    <div class="filter-wrap">
      <button class="filter-btn" type="button" id="filterBtn">Institutions <span id="filterSummary">(all)</span> ▾</button>
      <div class="filter-panel" id="filterPanel">
        <div class="filter-panel-actions">
          <button type="button" id="filterSelectAll">Select all</button>
          <button type="button" id="filterClearAll">Clear all</button>
        </div>
        <div id="filterOptions"></div>
      </div>
    </div>
  </div>
  <div id="jobs-list"><div class="empty">Loading jobs…</div></div>

<script>
  async function loadJSON(path) {
    const res = await fetch(path + '?t=' + Date.now());
    if (!res.ok) throw new Error('Failed to load ' + path);
    return res.json();
  }

  function fmtDate(iso) {
    if (!iso) return 'never';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function hexToRgba(hex, alpha) {
    const h = (hex || '#888888').replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  const ARCHIVE_KEY = 'archivedJobUrls';

  function getArchivedUrls() {
    try {
      return new Set(JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function archiveUrl(url) {
    try {
      const archived = getArchivedUrls();
      archived.add(url);
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify([...archived]));
    } catch (e) {
      // localStorage unavailable (private browsing, storage blocked, etc.) —
      // the card still gets removed from view for this page load either way.
    }
  }

  function daysLeftFor(closingDateIso, todayMidnight) {
    if (!closingDateIso) return null;
    const closing = new Date(closingDateIso + 'T00:00:00');
    return Math.round((closing - todayMidnight) / 86400000);
  }

  const INSTITUTION_FILTER_KEY = 'selectedInstitutions';

  // null means "no filter saved yet" — treated as "show everything" until the
  // user actually deselects something, so the default view is unfiltered.
  function getSelectedInstitutions() {
    try {
      const raw = localStorage.getItem(INSTITUTION_FILTER_KEY);
      return raw === null ? null : new Set(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  }

  function saveSelectedInstitutions(set) {
    try {
      localStorage.setItem(INSTITUTION_FILTER_KEY, JSON.stringify([...set]));
    } catch (e) {
      // localStorage unavailable — filter still works for this page load.
    }
  }

  async function render() {
    let branding = { institutions: {}, sources: {}, default: { color: '#eeeeee', emoji: '💼', url: null } };
    try {
      branding = await loadJSON('branding.json');
    } catch (e) {
      // branding.json is new — older workflow runs won't have written it yet.
      // Fall back to the neutral default style rather than failing the page.
    }

    try {
      const status = await loadJSON('status.json');
      const grid = document.getElementById('status-grid');
      grid.innerHTML = '';

      if (!status.length) {
        grid.innerHTML = '<div class="empty">No status data yet — run the workflow once.</div>';
      }

      let latestCheck = null;
      status.forEach(s => {
        if (s.checked_at && (!latestCheck || s.checked_at > latestCheck)) latestCheck = s.checked_at;
        const style = branding.sources[s.source] || branding.default;
        const name = s.institution || s.source;
        const nameHtml = style.url
          ? `<a href="${style.url}" target="_blank" rel="noopener">${name}</a>`
          : name;

        const card = document.createElement('div');
        card.className = 'card ' + s.status;
        card.style.background = hexToRgba(style.color, 0.75);
        card.innerHTML = `
          <div class="card-title"><span class="dot ${s.status}"></span>${style.emoji || ''} ${nameHtml}</div>
          <div class="meta">
            Checked: ${fmtDate(s.checked_at)}<br>
            Last success: ${fmtDate(s.last_success)}<br>
            Jobs found: ${s.jobs_found ?? '—'}
          </div>
          ${s.status === 'error' ? `<div class="error-text">${s.error}</div>` : ''}
        `;
        grid.appendChild(card);
      });

      document.getElementById('last-updated').textContent =
        latestCheck ? 'Last scan: ' + fmtDate(latestCheck) : 'No scans recorded yet';
    } catch (e) {
      document.getElementById('status-grid').innerHTML = '<div class="empty">Could not load status.json</div>';
    }

    try {
      const archived = getArchivedUrls();
      const allJobs = await loadJSON('jobs.json');
      const jobs = allJobs.filter(j => !archived.has(j.url));
      const list = document.getElementById('jobs-list');

      const allInstitutions = [...new Set(jobs.map(j => j.institution))].sort();
      const savedSelection = getSelectedInstitutions();
      // No saved selection at all (first visit) defaults to everything shown.
      // Once the user has customized it, a brand-new institution that shows up
      // later starts unselected until they notice and check it in the panel.
      let selected = savedSelection === null
        ? new Set(allInstitutions)
        : new Set([...savedSelection].filter(i => allInstitutions.includes(i)));

      function updateFilterSummary() {
        const summary = document.getElementById('filterSummary');
        summary.textContent = selected.size === allInstitutions.length ? '(all)' : `(${selected.size} of ${allInstitutions.length})`;
      }

      function renderFilterOptions() {
        const optionsEl = document.getElementById('filterOptions');
        optionsEl.innerHTML = '';
        allInstitutions.forEach(inst => {
          const style = branding.institutions[inst] || branding.default;
          const label = document.createElement('label');
          label.className = 'filter-option';
          label.innerHTML = `<input type="checkbox" ${selected.has(inst) ? 'checked' : ''}> ${style.emoji || ''} ${inst}`;
          label.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) selected.add(inst); else selected.delete(inst);
            saveSelectedInstitutions(selected);
            updateFilterSummary();
            renderJobList();
          });
          optionsEl.appendChild(label);
        });
      }

      if (!allInstitutions.length) {
        document.querySelector('.filter-wrap').style.display = 'none';
      } else {
        renderFilterOptions();
        updateFilterSummary();
      }

      document.getElementById('filterSelectAll').addEventListener('click', () => {
        selected = new Set(allInstitutions);
        saveSelectedInstitutions(selected);
        updateFilterSummary();
        renderFilterOptions();
        renderJobList();
      });
      document.getElementById('filterClearAll').addEventListener('click', () => {
        selected = new Set();
        saveSelectedInstitutions(selected);
        updateFilterSummary();
        renderFilterOptions();
        renderJobList();
      });

      const filterBtn = document.getElementById('filterBtn');
      const filterPanel = document.getElementById('filterPanel');
      filterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        filterPanel.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!filterPanel.contains(e.target) && e.target !== filterBtn) filterPanel.classList.remove('open');
      });

      const todayMidnight = new Date();
      todayMidnight.setHours(0, 0, 0, 0);

      function renderJobCard(j, daysLeft) {
        const style = branding.institutions[j.institution] || branding.default;

        let closingSoonBadge = '';
        if (daysLeft !== null && daysLeft <= 3) {
          const label = daysLeft <= 0 ? 'Closes today' : daysLeft === 1 ? '1 day left' : `${daysLeft} days left`;
          closingSoonBadge = `<span class="closing-soon">${label}</span>`;
        }

        const el = document.createElement('div');
        el.className = 'job';
        el.style.background = hexToRgba(style.color, 0.75);
        el.innerHTML = `
          <div class="job-top">
            <a href="${j.url}" target="_blank" rel="noopener">${style.emoji || ''} ${j.title}</a>
            <span style="display:flex; gap:0.4rem; align-items:flex-start;">
              ${closingSoonBadge}
              <button class="archive-btn" type="button">Archive</button>
            </span>
          </div>
          <div class="meta">
            ${j.institution} · ${j.salary_text} · ${j.location_text}<br>
            Closes: ${j.closing_date} · First seen: ${fmtDate(j.first_seen)}
          </div>
        `;
        el.querySelector('.archive-btn').addEventListener('click', () => {
          archiveUrl(j.url);
          el.remove();
          if (!list.querySelector('.job')) {
            list.innerHTML = '<div class="empty">No matching jobs yet.</div>';
          }
        });
        return el;
      }

      function renderJobList() {
        list.innerHTML = '';
        const visible = jobs.filter(j => selected.has(j.institution));

        if (!visible.length) {
          list.innerHTML = `<div class="empty">${jobs.length ? 'No jobs match the selected institutions.' : 'No matching jobs yet.'}</div>`;
          return;
        }

        const withDays = visible
          .map(j => ({ job: j, daysLeft: daysLeftFor(j.closing_date_iso, todayMidnight) }))
          .sort((a, b) => (a.daysLeft ?? Infinity) - (b.daysLeft ?? Infinity)); // soonest closing first; no deadline listed sorts last

        withDays.forEach(x => list.appendChild(renderJobCard(x.job, x.daysLeft)));
      }

      renderJobList();
    } catch (e) {
      document.getElementById('jobs-list').innerHTML = '<div class="empty">Could not load jobs.json</div>';
    }
  }

  render();
</script>
</body>
</html>
