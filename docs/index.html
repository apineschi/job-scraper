<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scraper Status</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9198a5;
    --ok: #3ecf6e;
    --err: #f2545b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.75rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    padding: 0.9rem 1rem;
  }
  .card.ok { border-left-color: var(--ok); }
  .card.error { border-left-color: var(--err); }
  .card-title { font-weight: 600; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); }
  .dot.error { background: var(--err); }
  .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
  .error-text { color: var(--err); font-size: 0.82rem; margin-top: 0.4rem; word-break: break-word; }
  .job {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.6rem;
    color: #1a1a1a;
  }
  .job .meta { color: #3a3a3a; }
  .job a { color: #111; text-decoration: none; font-weight: 600; }
  .job a:hover { text-decoration: underline; }
  .job .meta { margin-top: 0.3rem; }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
  .closing-soon {
    background: #ffd6d6;
    color: #7a1a1a;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .archive-btn {
    background: rgba(0,0,0,0.08);
    color: #333;
    border: none;
    border-radius: 4px;
    padding: 0.2rem 0.55rem;
    font-size: 0.72rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .archive-btn:hover { background: rgba(0,0,0,0.16); }
</style>
</head>
<body>
  <h1>Job Scraper Status</h1>
  <div class="subtitle" id="last-updated">Loading…</div>

  <h2>Source health</h2>
  <div class="grid" id="status-grid"><div class="empty">Loading status…</div></div>

  <h2>Recent matches</h2>
  <div id="jobs-list"><div class="empty">Loading jobs…</div></div>

<script>
  async function loadJSON(path) {
    const res = await fetch(path + '?t=' + Date.now());
    if (!res.ok) throw new Error('Failed to load ' + path);
    return res.json();
  }

  function fmtDate(iso) {
    if (!iso) return 'never';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  const ARCHIVE_KEY = 'archivedJobUrls';

  function getArchivedUrls() {
    try {
      return new Set(JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function archiveUrl(url) {
    try {
      const archived = getArchivedUrls();
      archived.add(url);
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify([...archived]));
    } catch (e) {
      // localStorage unavailable (private browsing, storage blocked, etc.) —
      // the card still gets removed from view for this page load either way.
    }
  }

  async function render() {
    try {
      const status = await loadJSON('status.json');
      const grid = document.getElementById('status-grid');
      grid.innerHTML = '';

      if (!status.length) {
        grid.innerHTML = '<div class="empty">No status data yet — run the workflow once.</div>';
      }

      let latestCheck = null;
      status.forEach(s => {
        if (s.checked_at && (!latestCheck || s.checked_at > latestCheck)) latestCheck = s.checked_at;
        const card = document.createElement('div');
        card.className = 'card ' + s.status;
        card.innerHTML = `
          <div class="card-title"><span class="dot ${s.status}"></span>${s.institution || s.source}</div>
          <div class="meta">
            Checked: ${fmtDate(s.checked_at)}<br>
            Last success: ${fmtDate(s.last_success)}<br>
            Jobs found: ${s.jobs_found ?? '—'}
          </div>
          ${s.status === 'error' ? `<div class="error-text">${s.error}</div>` : ''}
        `;
        grid.appendChild(card);
      });

      document.getElementById('last-updated').textContent =
        latestCheck ? 'Last scan: ' + fmtDate(latestCheck) : 'No scans recorded yet';
    } catch (e) {
      document.getElementById('status-grid').innerHTML = '<div class="empty">Could not load status.json</div>';
    }

    let branding = { institutions: {}, default: { color: '#eeeeee', emoji: '💼' } };
    try {
      branding = await loadJSON('branding.json');
    } catch (e) {
      // branding.json is new — older workflow runs won't have written it yet.
      // Fall back to the neutral default style rather than failing the job list.
    }

    try {
      const archived = getArchivedUrls();
      const allJobs = await loadJSON('jobs.json');
      const jobs = allJobs.filter(j => !archived.has(j.url));
      const list = document.getElementById('jobs-list');
      list.innerHTML = '';

      if (!jobs.length) {
        list.innerHTML = '<div class="empty">No matching jobs yet.</div>';
        return;
      }

      const todayMidnight = new Date();
      todayMidnight.setHours(0, 0, 0, 0);

      jobs.forEach(j => {
        const style = branding.institutions[j.institution] || branding.default;

        let closingSoonBadge = '';
        if (j.closing_date_iso) {
          const closing = new Date(j.closing_date_iso + 'T00:00:00');
          const daysLeft = Math.round((closing - todayMidnight) / 86400000);
          if (daysLeft >= 0 && daysLeft <= 3) {
            const label = daysLeft === 0 ? 'Closes today' : daysLeft === 1 ? '1 day left' : `${daysLeft} days left`;
            closingSoonBadge = `<span class="closing-soon">${label}</span>`;
          }
        }

        const el = document.createElement('div');
        el.className = 'job';
        el.style.background = style.color;
        el.innerHTML = `
          <div class="job-top">
            <a href="${j.url}" target="_blank" rel="noopener">${style.emoji || ''} ${j.title}</a>
            <span style="display:flex; gap:0.4rem; align-items:flex-start;">
              ${closingSoonBadge}
              <button class="archive-btn" type="button">Archive</button>
            </span>
          </div>
          <div class="meta">
            ${j.institution} · ${j.salary_text} · ${j.location_text}<br>
            Closes: ${j.closing_date} · First seen: ${fmtDate(j.first_seen)}
          </div>
        `;
        el.querySelector('.archive-btn').addEventListener('click', () => {
          archiveUrl(j.url);
          el.remove();
          if (!list.querySelector('.job')) {
            list.innerHTML = '<div class="empty">No matching jobs yet.</div>';
          }
        });
        list.appendChild(el);
      });
    } catch (e) {
      document.getElementById('jobs-list').innerHTML = '<div class="empty">Could not load jobs.json</div>';
    }
  }

  render();
</script>
</body>
</html>
